<title>서류 제출 대장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Layout: one narrow column — month filter, two figure cards, then the ledger table. */
  :root {
    --bg: #f3f5f7;
    --surface: #ffffff;
    --fg: #17212b;
    --muted: #5d6b78;
    --line: #dde3e9;
    --accent: #1f5fa8;
    --accent-soft: #e4edf7;
    --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11161c; --surface: #19212a; --fg: #e6ebf0; --muted: #93a1ae;
      --line: #2a3541; --accent: #7fb2ec; --accent-soft: #1d3149; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11161c; --surface: #19212a; --fg: #e6ebf0; --muted: #93a1ae;
    --line: #2a3541; --accent: #7fb2ec; --accent-soft: #1d3149; color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
  .wrap {
    max-width: 760px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 32px 48px;
    display: grid; gap: 20px;
  }
  header h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 0.875rem; }

  .months { display: flex; flex-wrap: wrap; gap: 6px; }
  .months button {
    font: 500 0.875rem var(--font-body); color: var(--muted);
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 11px; cursor: pointer; font-variant-numeric: tabular-nums;
  }
  .months button:hover { color: var(--fg); border-color: var(--muted); }
  .months button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  .months button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .figures { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .figure { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; }
  .figure .label { font-size: 0.8125rem; color: var(--muted); letter-spacing: 0.02em; }
  .figure .value { font: 600 2rem/1.15 var(--font-num); font-variant-numeric: tabular-nums; margin-top: 6px; }
  .figure .value small { font: 500 0.875rem var(--font-body); color: var(--muted); margin-left: 4px; }

  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .tools input, .tools select {
    font: 400 0.9375rem var(--font-body); color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 11px; min-width: 0;
  }
  .tools input { flex: 1 1 220px; }
  .tools select { flex: 0 0 auto; cursor: pointer; }
  .tools input:focus-visible, .tools select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tools input::placeholder { color: var(--muted); }

  .table-box { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; min-width: 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 11px 16px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 0.75rem; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; }
  td.name { white-space: normal; }
  td.date { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.875rem; }
  th.num, td.num { text-align: right; }
  td.num { font-family: var(--font-num); font-weight: 600; font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: 0; }
  .tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; font-size: 0.6875rem; background: var(--accent-soft); color: var(--accent); vertical-align: 1px; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }

  @media (max-width: 420px) {
    .figure .value { font-size: 1.625rem; }
    th, td { padding: 10px 12px; }
  }
</style>

<div class="wrap">
  <header>
    <h1>서류 제출 대장</h1>
    <p id="status">기록을 불러오는 중입니다.</p>
  </header>

  <nav class="months" id="months" aria-label="월 선택"></nav>

  <section class="figures" aria-label="요약">
    <div class="figure"><div class="label">제출 기록</div><div class="value"><span id="rowCount">0</span><small>건</small></div></div>
    <div class="figure"><div class="label">제출 건수 합계</div><div class="value"><span id="sum">0</span><small>건</small></div></div>
  </section>

  <div class="tools">
    <input type="search" id="q" placeholder="서류 이름 검색" aria-label="서류 이름 검색" autocomplete="off">
    <select id="sort" aria-label="정렬">
      <option value="date">최근 제출일 순</option>
      <option value="desc">건수 많은 순</option>
      <option value="asc">건수 적은 순</option>
    </select>
  </div>

  <div class="table-box">
    <table>
      <thead><tr><th>제출일</th><th>서류 이름</th><th class="num">제출 건수</th></tr></thead>
      <tbody id="rows"><tr><td class="empty" colspan="3">제출 기록이 들어오면 여기에 날짜순으로 표시됩니다.</td></tr></tbody>
    </table>
  </div>
</div>

<script>
  const state = { month: 0, q: "", sort: "date", docs: [], loaded: false };
  try {
    state.month = Number(localStorage.getItem("month")) || 0;
    state.sort = localStorage.getItem("sort") || "date";
  } catch (e) {}

  const qEl = document.getElementById("q");
  const sortEl = document.getElementById("sort");
  sortEl.value = state.sort;
  qEl.addEventListener("input", () => { state.q = qEl.value.trim().toLowerCase(); render(); });
  sortEl.addEventListener("change", () => {
    state.sort = sortEl.value;
    try { localStorage.setItem("sort", state.sort); } catch (e) {}
    render();
  });

  const monthsEl = document.getElementById("months");
  const labels = ["전체", ...Array.from({ length: 12 }, (_, i) => (i + 1) + "월")];
  labels.forEach((text, m) => {
    const b = document.createElement("button");
    b.type = "button"; b.id = "m" + m; b.textContent = text;
    b.addEventListener("click", () => {
      state.month = m;
      try { localStorage.setItem("month", String(m)); } catch (e) {}
      render();
    });
    monthsEl.appendChild(b);
  });

  function render() {
    monthsEl.querySelectorAll("button").forEach((b, m) => b.setAttribute("aria-pressed", String(m === state.month)));
    const rows = state.docs
      .filter(d => !state.month || Number(String(d.date).slice(5, 7)) === state.month)
      .filter(d => !state.q || String(d.name || "").toLowerCase().includes(state.q))
      .sort((a, b) => {
        const byDate = String(b.date).localeCompare(String(a.date));
        const diff = (Number(a.count) || 0) - (Number(b.count) || 0);
        if (state.sort === "asc") return diff || byDate;
        if (state.sort === "desc") return -diff || byDate;
        return byDate;
      });
    document.getElementById("rowCount").textContent = rows.length;
    document.getElementById("sum").textContent = rows.reduce((s, d) => s + (Number(d.count) || 0), 0);

    const tbody = document.getElementById("rows");
    tbody.replaceChildren();
    if (!rows.length) {
      const tr = tbody.insertRow(); const td = tr.insertCell();
      td.colSpan = 3; td.className = "empty";
      td.textContent = !state.loaded ? "제출 기록이 들어오면 여기에 날짜순으로 표시됩니다."
        : state.q ? "‘" + qEl.value.trim() + "’이(가) 들어간 서류가 없습니다."
        : state.month ? state.month + "월에 제출된 서류가 없습니다." : "아직 제출 기록이 없습니다.";
      return;
    }
    for (const d of rows) {
      const tr = tbody.insertRow();
      const c1 = tr.insertCell(); c1.className = "date"; c1.textContent = String(d.date).replaceAll("-", ".");
      const c2 = tr.insertCell(); c2.className = "name"; c2.textContent = d.name || "";
      if (d.example) { const t = document.createElement("span"); t.className = "tag"; t.textContent = "예시"; c2.appendChild(t); }
      const c3 = tr.insertCell(); c3.className = "num"; c3.textContent = Number(d.count) || 0;
    }
  }
  render();

  const status = document.getElementById("status");
  (async () => {
    const db = window.claude ? await window.claude.use("db") : null;
    if (!db) { status.textContent = "이 화면에서는 저장된 기록을 불러올 수 없습니다."; return; }
    db.collection("submissions").onSnapshot(snap => {
      state.docs = snap.docs.map(s => s.data());
      state.loaded = true;
      status.textContent = "협력사별 서류 제출 건수를 월별로 모아 봅니다.";
      render();
    }, () => { status.textContent = "기록을 불러오지 못했습니다. 페이지를 새로 열어 주세요."; });
  })();
</script>
